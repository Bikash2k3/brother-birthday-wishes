<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anal Anish!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="birthday-card">
            <h1 class="title">🎉 HAPPY BIRTHDAY ANAL ANISH! 🎉</h1>
            
            <div class="balloons">
                <div class="balloon balloon-1"></div>
                <div class="balloon balloon-2"></div>
                <div class="balloon balloon-3"></div>
                <div class="balloon balloon-4"></div>
            </div>

            <div class="content">
                <p class="message">Dear Anal Anish,</p>
                <p class="wishes">
                    Wishing you a wonderful day filled with joy, laughter, and special moments!
                    May all your dreams come true and may this year bring you happiness and success!
                </p>
                
                <button id="musicBtn" class="music-button">🎵 Play Birthday Music</button>
                
                <div class="confetti">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="footer">
                <p>With love and best wishes ❤️</p>
            </div>
        </div>
    </div>

    <!-- Audio element for birthday song -->
    <audio id="birthdayAudio">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script src="script.js"></script>
</body>
</html>
